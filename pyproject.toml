[project]
name = "flowtrace"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Priyam Srivastava", email = "priyamsrivastava10072003@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.6",
    "fastapi>=0.142.2",
    "lightgbm>=4.7.0",
    "mlflow>=3.16.1",
    "pandera>=0.33.1",
    "polars>=1.44.2",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "scikit-learn>=1.9.1",
    "shap>=0.52.0",
    "sqlalchemy>=2.1.3",
    "typer>=0.27.2",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
flowtrace = "flowtrace:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "mypy>=2.4.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
]
